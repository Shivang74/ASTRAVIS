name: Build and Deploy ASTRAVIS to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build React Frontend
        working-directory: ./spherex-engine/frontend
        run: |
          npm install
          npm run build

      - name: Bundle Frontend Dist & Install Backend Dependencies
        working-directory: ./spherex-engine/backend
        run: |
          cp -r ../frontend/dist ./frontend-dist
          npm install

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'astravis-spherex'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './spherex-engine/backend'